---
layout: default
comments: true
---

<article>
  <h2>{{ page.title }}</h2>
  <time datetime="{{ page.date | date_to_xmlschema }}" class="by-line">{{ page.date | date_to_string }}</time>
  {{ content }}

  <nav class="post-nav" aria-label="Navegação entre posts">
    {% if page.previous %}
      <a class="post-nav__link post-nav__link--older" href="{{ page.previous.url | prepend: site.baseurl | replace: '//', '/' }}">
        <span class="post-nav__kicker">&larr; Mais antigo</span>
        <span class="post-nav__title">{{ page.previous.title }}</span>
      </a>
    {% endif %}

    <a class="post-nav__link post-nav__link--index" href="{{ '/' | prepend: site.baseurl | replace: '//', '/' }}">
      <span class="post-nav__kicker">Índice</span>
      <span class="post-nav__title">Ver todos os posts</span>
    </a>

    {% if page.next %}
      <a class="post-nav__link post-nav__link--newer" href="{{ page.next.url | prepend: site.baseurl | replace: '//', '/' }}">
        <span class="post-nav__kicker">Mais recente &rarr;</span>
        <span class="post-nav__title">{{ page.next.title }}</span>
      </a>
    {% endif %}
  </nav>

  <div id="disqus_thread"></div>
  <script>

  /**

  *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables*/

  this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
  this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
  };
  */
  (function() { // DON'T EDIT BELOW THIS LINE
  var d = document, s = d.createElement('script');
  s.src = 'https://valdersonjr.disqus.com/embed.js';
  s.setAttribute('data-timestamp', +new Date());
  (d.head || d.body).appendChild(s);
  })();
  </script>
  <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</article>
